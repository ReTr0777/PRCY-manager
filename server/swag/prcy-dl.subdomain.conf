## PRCY Manager — public installer downloads
##
## Copy to  /config/nginx/proxy-confs/prcy-dl.subdomain.conf  in SWAG,
## set $upstream_app to your server's address, and restart the container.
##
## This points at PRCY_PUBLIC_PORT, the listener that serves share links and
## nothing else. The console, the API, the accounts and every save live on the
## other port and are not reachable through here — so there is no location
## filtering to get right, and a mistake in this file cannot expose them.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name dl.*;
    include /config/nginx/ssl.conf;

    client_max_body_size 1m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app 192.168.1.x;   # your Unraid address
        set $upstream_port 8788;         # PRCY_PUBLIC_PORT
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Stream the installer straight through rather than spooling 80 MB to
        # disk first, and give a slow connection time to finish.
        proxy_buffering off;
        proxy_max_temp_file_size 0;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # A share link is meant to be given out, not found.
        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
