## PRCY Manager — sync for people outside your network
##
## Copy to  /config/nginx/proxy-confs/prcy-sync.subdomain.conf  in SWAG,
## set $upstream_app to your server's address, and restart the container.
##
## This points at PRCY_SYNC_PORT, which serves signing in, libraries, saves and
## cover art — and answers 404 to the console and every /v1/admin route, even
## when the admin token is presented. Managing the server stays on the private
## port, so nothing here can reach it.
##
## Set PRCY_TRUST_PROXY=1 on the container alongside this, or the login rate
## limiter will see one address for the whole internet and lock everyone out
## when a single person guesses wrong ten times.

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name sync.*;
    include /config/nginx/ssl.conf;

    # Comfortably above PRCY_CHUNK_MB: saves arrive in chunks that size, and
    # nginx's 1 MB default would reject every one of them.
    client_max_body_size 64m;

    location / {
        include /config/nginx/proxy.conf;
        include /config/nginx/resolver.conf;

        set $upstream_app 192.168.1.x;   # your Unraid address
        set $upstream_port 8789;         # PRCY_SYNC_PORT
        set $upstream_proto http;
        proxy_pass $upstream_proto://$upstream_app:$upstream_port;

        # Timeouts are deliberately not set here. SWAG's proxy.conf already
        # defines them, and defining them twice is a duplicate directive that
        # stops nginx from starting — taking every other site down with it.

        add_header X-Robots-Tag "noindex, nofollow" always;
    }
}
