services:
  prcy-sync:
    build: .
    image: prcy-sync:latest
    container_name: prcy-sync
    restart: unless-stopped
    ports:
      - '8787:8787'
      # The downloads-only listener. Publish this one if you want people
      # outside your network to be able to fetch the installer.
      - '8788:8788'
    environment:
      # Generate each with:
      #   node -e "console.log(require('crypto').randomBytes(32).toString('hex'))"
      #
      # Manages accounts. Never put this in the app — it is yours alone.
      PRCY_ADMIN_TOKEN: ${PRCY_ADMIN_TOKEN:?set PRCY_ADMIN_TOKEN in .env}
      # Anyone with this code can create an account. Leave it out to close
      # sign-ups and add people yourself with the admin token.
      PRCY_INVITE_CODE: ${PRCY_INVITE_CODE:-}
      # Largest body accepted in one request, in MB. Keep it under any proxy's
      # limit — Cloudflare's free and Pro plans cut off at 100 MB. Bigger
      # uploads are split into chunks by the app automatically.
      PRCY_CHUNK_MB: ${PRCY_CHUNK_MB:-8}
      # Serves share links and nothing else. Leave unset to turn it off.
      PRCY_PUBLIC_PORT: ${PRCY_PUBLIC_PORT:-8788}
      # The address people outside reach you at, so the console hands out a
      # link that works for them rather than one only you can use.
      PRCY_PUBLIC_URL: ${PRCY_PUBLIC_URL:-}
    volumes:
      # On Unraid this is usually /mnt/user/appdata/prcy-sync
      - ./data:/data
